name: Release CLI

on:
  push:
    tags:
      - 'v*'
  # Manual runs are non-publishing smoke builds. A single platform family can
  # be verified before tagging without spending time on unrelated targets.
  workflow_dispatch:
    inputs:
      platform:
        description: Platform set to build without publishing
        required: true
        default: mac
        type: choice
        options:
          - mac
          - linux
          - win
          - all
      sign_windows:
        description: Sign a manual Windows smoke build with Azure Artifact Signing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(
          github.event_name == 'workflow_dispatch' && inputs.platform == 'mac' &&
          '{"include":[{"target":"aarch64-apple-darwin","os":"macos-latest"},{"target":"x86_64-apple-darwin","os":"macos-latest"}]}' ||
          github.event_name == 'workflow_dispatch' && inputs.platform == 'linux' &&
          '{"include":[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04","cxx":"g++-12"},{"target":"aarch64-unknown-linux-gnu","os":"ubuntu-22.04-arm","no_simsimd":true}]}' ||
          github.event_name == 'workflow_dispatch' && inputs.platform == 'win' &&
          '{"include":[{"target":"x86_64-pc-windows-msvc","os":"windows-2022","no_simsimd":true,"extra_cxxflags":"/DMAP_FAILED=((void*)-1)"}]}' ||
          '{"include":[{"target":"aarch64-apple-darwin","os":"macos-latest"},{"target":"x86_64-apple-darwin","os":"macos-latest"},{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04","cxx":"g++-12"},{"target":"aarch64-unknown-linux-gnu","os":"ubuntu-22.04-arm","no_simsimd":true},{"target":"x86_64-pc-windows-msvc","os":"windows-2022","no_simsimd":true,"extra_cxxflags":"/DMAP_FAILED=((void*)-1)"}]}'
        ) }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify release tag matches Cargo version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          test -n "$cargo_version"
          if [[ "$tag_version" != "$cargo_version" ]]; then
            echo "Tag v${tag_version} does not match Cargo.toml version ${cargo_version}." >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then
            export CXX="${{ matrix.cxx }}"
            "$CXX" --version
          fi
          if [ "${{ matrix.no_simsimd }}" = "true" ]; then
            cargo build --locked --release --target ${{ matrix.target }} --no-default-features
          else
            cargo build --locked --release --target ${{ matrix.target }}
          fi
        shell: bash
        env:
          CXXFLAGS: ${{ matrix.extra_cxxflags }}

      - name: Verify Linux CLI compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/mdvdb"
          test -x "$binary"

          file "$binary"
          file "$binary" | grep -F 'ELF 64-bit'
          "$binary" --version
          "$binary" --help | grep -F 'Markdown Vector Database'

          dependencies="$(ldd "$binary")"
          printf '%s\n' "$dependencies"
          if grep -F 'not found' <<<"$dependencies"; then
            echo 'Linux release binary has unresolved shared-library dependencies.' >&2
            exit 1
          fi

          max_glibc="$(
            readelf --version-info "$binary" |
              grep -o 'GLIBC_[0-9.]*' |
              sort -Vu |
              tail -1
          )"
          test -n "$max_glibc"
          echo "Maximum required glibc symbol: $max_glibc"
          dpkg --compare-versions "${max_glibc#GLIBC_}" le '2.35'

          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          "$binary" --root "$smoke_root" --json init
          test -f "$smoke_root/.markdownvdb/config.yaml"

      - name: Verify Windows CLI compatibility
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = "target/${{ matrix.target }}/release/mdvdb.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Missing Windows release binary: $binary"
          }

          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw 'mdvdb --version failed' }
          $help = & $binary --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $help -notmatch 'Markdown Vector Database') {
            throw 'mdvdb --help did not contain the expected product description'
          }

          $smokeRoot = Join-Path $env:RUNNER_TEMP "mdvdb-windows-smoke-${{ github.run_id }}"
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null
          & $binary --root $smokeRoot --json init
          if ($LASTEXITCODE -ne 0) { throw 'mdvdb init failed' }
          $config = Join-Path $smokeRoot '.markdownvdb/config.yaml'
          if (-not (Test-Path -LiteralPath $config -PathType Leaf)) {
            throw "mdvdb init did not create $config"
          }

      - name: Sign Windows CLI with Azure Artifact Signing
        if: >-
          runner.os == 'Windows' &&
          (github.event_name == 'push' || inputs.sign_windows)
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\target\${{ matrix.target }}\release\mdvdb.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          exclude-environment-credential: false
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify Windows CLI signature
        if: >-
          runner.os == 'Windows' &&
          (github.event_name == 'push' || inputs.sign_windows)
        shell: pwsh
        env:
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:WINDOWS_PUBLISHER_NAME) {
            throw 'WINDOWS_PUBLISHER_NAME repository variable is required for signed builds.'
          }
          $binary = "target/${{ matrix.target }}/release/mdvdb.exe"
          $signature = Get-AuthenticodeSignature -FilePath $binary
          if ($signature.Status -ne 'Valid') {
            throw "Invalid Authenticode signature: $($signature.StatusMessage)"
          }
          $expectedCommonName = "CN=$env:WINDOWS_PUBLISHER_NAME"
          if ($signature.SignerCertificate.Subject -notmatch [regex]::Escape($expectedCommonName)) {
            throw "Expected signer $expectedCommonName; got $($signature.SignerCertificate.Subject)."
          }

      # The certificate and Apple credentials are exposed only to macOS jobs.
      - name: Import Developer ID Application certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/mdvdb-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$CSC_LINK" | openssl base64 -d -A -out "$certificate_path"
          test -s "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 7200 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$CSC_KEY_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="Developer ID Application: Industrial Code & Magic GmbH (${APPLE_TEAM_ID})"
          identities="$(security find-identity -v -p codesigning "$keychain_path")"
          printf '%s\n' "$identities"
          grep -F "$signing_identity" <<<"$identities"

          echo "MACOS_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Sign and verify macOS CLI
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/mdvdb"
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --identifier dev.mdvdb.cli \
            --keychain "$MACOS_KEYCHAIN_PATH" \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$binary"

          signature="$(codesign -dv --verbose=4 "$binary" 2>&1)"
          grep -F 'Identifier=dev.mdvdb.cli' <<<"$signature"
          grep -F 'Authority=Developer ID Application: Industrial Code & Magic GmbH' <<<"$signature"
          grep -F "TeamIdentifier=${APPLE_TEAM_ID}" <<<"$signature"
          grep -F 'runtime' <<<"$signature"
          codesign --verify --strict --verbose=4 "$binary"

      - name: Notarize and assess macOS CLI
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZATION_TIMEOUT_MINUTES: '90'
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/mdvdb"
          submission_zip="$RUNNER_TEMP/mdvdb-${{ matrix.target }}-notarization.zip"
          ditto -c -k --sequesterRsrc --keepParent "$binary" "$submission_zip"
          scripts/notarize-cli-macos.sh "$submission_zip" "$binary"

      # Raw binary names (mdvdb-<target> / mdvdb-<target>.exe) are a CONTRACT with
      # the desktop app's in-app installer: app/src/main/cli-install.ts getAssetName().
      # Do NOT rename them without updating the app.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="smoke-$GITHUB_RUN_NUMBER"
          fi
          archive="mdvdb-${version}-${{ matrix.target }}.tar.gz"
          raw_binary="mdvdb-${{ matrix.target }}"
          tar -czf "$archive" -C target/${{ matrix.target }}/release mdvdb
          cp target/${{ matrix.target }}/release/mdvdb "$raw_binary"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "RAW_BINARY=$raw_binary" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "smoke-$env:GITHUB_RUN_NUMBER" }
          $archive = "mdvdb-$version-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/mdvdb.exe" -DestinationPath $archive
          $rawBinary = "mdvdb-${{ matrix.target }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/mdvdb.exe" $rawBinary
          echo "ARCHIVE=$archive" >> $env:GITHUB_ENV
          echo "RAW_BINARY=$rawBinary" >> $env:GITHUB_ENV

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.RAW_BINARY }}
          if-no-files-found: error
          retention-days: 7

      - name: Delete temporary signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/mdvdb-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id-application.p12"

  # A tag release is created only after every target built successfully. It is
  # left as a draft for an explicit final review instead of exposing partial assets.
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: mdvdb ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*

# Metadata schema overlay for the test vault
# Auto-inferred fields are enriched with these annotations

fields:
  title:
    type: string
    description: "Document title"
    required: true

  tags:
    type: list
    item_type: string
    description: "Categorization tags"

  category:
    type: string
    description: "Document category"
    allowed_values:
      - documentation
      - notes
      - guides
      - runbooks

  author:
    type: string
    description: "Primary author"

  status:
    type: string
    description: "Publication status"
    allowed_values:
      - draft
      - published
      - archived
    default: draft

  severity:
    type: string
    description: "Severity level for runbooks"
    allowed_values:
      - critical
      - high
      - medium
      - low

  version:
    type: string
    description: "Version number (semver)"
scopes:
  notes:
    fields:
      category:
        field_type: string
        allowed_values:
          - notes
      status:
        field_type: string
        allowed_values:
          - draft

  # Frontmatter relations (phase 31): folders as tables, wiki links as
  # foreign keys. `target:` scopes the app's picker and resolves bare
  # names like [[initech]] against that folder.
  invoices:
    fields:
      client:
        field_type: relation
        target: clients
        description: "The billed client (FK into clients/)"
      project:
        field_type: relation
        target: projects
        description: "The project this invoice bills"
      related:
        field_type: relation
        description: "Other invoices this one relates to"
      status:
        field_type: string
        allowed_values:
          - draft
          - sent
          - paid

  projects:
    fields:
      client:
        field_type: relation
        target: clients
        description: "The client this project belongs to"
      status:
        field_type: string
        allowed_values:
          - planned
          - in-progress
          - done
  runbooks:
    fields:
      category:
        field_type: string
        allowed_values:
          - runbooks
